<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手機畫面預覽</title>
  <link rel="stylesheet" href="/preview.css">
</head>
<body>
  <header>
    <h1>手機畫面預覽</h1>
    <nav><a href="/preview-desktop.html">切換到電腦 16:9 →</a></nav>
    <label>裝置 <select id="device"></select></label>
    <label>縮放 <select id="scale"></select></label>
    <label>身分
      <select id="role">
        <option value="all" selected>主持人＋一般玩家</option>
        <option value="host">只看主持人</option>
        <option value="guest">只看一般玩家</option>
      </select>
    </label>
    <button type="button" id="tweak-toggle" class="tweak-toggle">調整面板</button>
    <p class="hint">改完 CSS 後重新整理這一頁就會更新。每個畫面都可以另開新分頁單獨調整。</p>
  </header>
  <main class="grid" id="grid"></main>

  <script type="module">
    import { initGallery } from '/preview-gallery.js';

    initGallery({
      devices: [
        { label: 'iPhone SE', width: 375, height: 667 },
        { label: 'iPhone 標準', width: 390, height: 844 },
        { label: 'iPhone Pro Max', width: 430, height: 932 },
        { label: 'iPad 直向', width: 768, height: 1024 },
      ],
      defaultDevice: 1,
      scales: [1, 0.75, 0.5],
      defaultScale: 1,
      storagePrefix: 'preview-mobile',
    });
  </script>
</body>
</html>
