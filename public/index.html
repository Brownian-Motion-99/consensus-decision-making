<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>本次會議我們採取共識決</title>
  <!-- 加到主畫面時顯示的短名稱 -->
  <meta name="application-name" content="共識決">
  <meta name="apple-mobile-web-app-title" content="共識決">
  <!-- 網址列的顏色，要和 style.css 的 --color-bg 一致 -->
  <meta name="theme-color" content="#33658a">
  <!-- 分享預覽：連結貼到 LINE、Messenger 時顯示。og:image 等有 logo 之後再補 -->
  <meta name="description" content="2–8 人的派對遊戲。每一題大家各自寫下答案，全員一致才算達成共識，通過指定數量的決議才能散會。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="共識決">
  <meta property="og:title" content="本次會議我們採取共識決">
  <meta property="og:description" content="2–8 人的派對遊戲。每一題大家各自寫下答案，全員一致才算達成共識，通過指定數量的決議才能散會。">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <div class="notice" id="notice" hidden></div>

    <!-- 連線中 -->
    <section class="screen" data-screen="connecting">
      <div class="heartbeat" role="status">
        <span class="heartbeat-ring" aria-hidden="true"></span>
        <span class="heartbeat-ring" aria-hidden="true"></span>
        <span class="heartbeat-ring" aria-hidden="true"></span>
        <span class="heartbeat-ring" aria-hidden="true"></span>
        <span class="heartbeat-text">連線中…</span>
      </div>
    </section>

    <!-- 首頁：開房間或輸入房號 -->
    <section class="screen" data-screen="home" hidden>
      <!-- 之後放 logo 的位置 -->
      <div class="logo">
        <!-- 名稱太長，手機上一行放不下，固定拆成兩行 -->
        <h1 class="logo-title">本次會議<br>我們採取共識決</h1>
      </div>
      <form id="enter-form" class="stack">
        <input id="code-input" class="code-input" autocomplete="off" autocapitalize="characters"
          spellcheck="false" maxlength="4" required placeholder="會議編號" aria-label="會議編號">
        <div class="row">
          <button type="button" id="create-btn" class="btn btn-primary">召開會議</button>
          <button type="submit" class="btn">加入會議</button>
        </div>
      </form>
      </div>
    </section>

    <!-- 加入 -->
    <section class="screen" data-screen="join" hidden>
      <p class="muted" id="join-hint" hidden>會議召開了！取個暱稱，你就是這場會議的主席。</p>
      <form id="join-form" class="stack">
        <label for="name-input">暱稱</label>
        <input id="name-input" autocomplete="off" required>
        <button type="submit" class="btn btn-primary">加入</button>
      </form>
    </section>

    <!-- 題目進行中才加入：列席，下一題開始時轉為玩家 -->
    <section class="screen" data-screen="observing" hidden>
      <h2>列席中</h2>
      <p class="muted">下個議案開始時即可進入會議。</p>
    </section>

    <!-- 大廳 -->
    <section class="screen" data-screen="lobby" hidden>
      <div class="invite">
        <p class="room-code-line">會議編號 <span class="room-code" id="room-code"></span></p>
        <button type="button" id="copy-code-btn" class="btn btn-small">複製會議編號</button>
        <button type="button" id="copy-link-btn" class="btn btn-small">複製連結</button>
      </div>
      <h3>玩家 <span id="lobby-count"></span></h3>
      <ul class="players" id="lobby-players"></ul>
      <div class="host-only stack">
        <label for="target-input">需要通過幾項決議</label>
        <input id="target-input" type="number" inputmode="numeric" step="1">
        <button id="start-btn" class="btn btn-primary">開始會議</button>
      </div>
      <p class="guest-only muted" id="lobby-target"></p>
      <p class="guest-only muted">等待主席宣布開會…</p>
    </section>

    <!-- 作答 -->
    <section class="screen" data-screen="answering" hidden>
      <p class="progress" id="answer-progress"></p>
      <h2 class="question" id="answer-question"></h2>
      <div id="answer-form" class="stack">
        <div class="board-wrap">
          <canvas id="board" class="board" width="600" height="400" aria-label="手寫答案的白板"></canvas>
          <!-- 提示白板可以寫字畫畫，白板有內容就隱藏；不畫在 canvas 上，所以不會進到送出的圖 -->
          <svg class="board-hint" id="board-hint" viewBox="0 0 24 24" aria-hidden="true"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.9 3.6a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L8.5 19 3.5 20.5 5 15.5 16.9 3.6Z"/>
            <path d="M15 5.5l3.5 3.5"/>
            <path d="M5 15.5l3.5 3.5"/>
          </svg>
        </div>
        <form id="type-form">
          <input id="type-input" maxlength="30" autocomplete="off" enterkeyhint="done"
            placeholder="懶得寫字？打字也可以" aria-label="打字作答">
        </form>
        <div class="row">
          <button type="button" id="clear-btn" class="btn">清除</button>
          <button type="button" id="submit-btn" class="btn btn-primary">送出答案</button>
        </div>
      </div>
      <div id="my-answer" hidden>
        <p class="muted">你的答案（已送出）</p>
        <img id="my-answer-img" class="drawing" alt="你的答案">
      </div>
      <!-- 送出答案之後才顯示作答進度，主持人和一般玩家都一樣 -->
      <div id="answer-status" hidden>
        <h3>作答進度 <span id="answered-count"></span></h3>
        <ul class="players" id="answer-players"></ul>
      </div>
      <div class="host-only">
        <button id="reveal-btn" class="btn btn-primary">公開答案</button>
      </div>
    </section>

    <!-- 公開答案 + 判定 -->
    <section class="screen" data-screen="revealed" hidden>
      <p class="progress" id="reveal-progress"></p>
      <h2 class="question" id="reveal-question"></h2>
      <ul class="answers" id="reveal-answers"></ul>
      <p class="tally" id="tally"></p>
      <div class="result" id="result" hidden></div>
      <div class="host-only">
        <div class="row" id="judge-buttons">
          <button id="match-btn" class="btn btn-primary">達成共識</button>
          <button id="nomatch-btn" class="btn">未達共識</button>
        </div>
        <button id="next-btn" class="btn btn-primary" hidden></button>
      </div>
      <p class="guest-only muted" id="reveal-wait"></p>
    </section>

    <!-- 休會：遊戲中人數不足 -->
    <section class="screen" data-screen="paused" hidden>
      <h2>暫時休會</h2>
      <p class="muted" id="paused-message"></p>
      <h3>出席 <span id="paused-count"></span></h3>
      <ul class="players" id="paused-players"></ul>
      <div class="host-only">
        <button id="resume-btn" class="btn btn-primary">繼續會議</button>
      </div>
      <p class="guest-only muted">等待主席繼續會議…</p>
    </section>

    <!-- 結算 -->
    <section class="screen" data-screen="finished" hidden>
      <p class="score" id="score"></p>
      <div class="host-only">
        <button id="lobby-btn" class="btn btn-primary">召開下一場會議</button>
      </div>
      <p class="guest-only muted">等待主席召開下一場會議…</p>
    </section>

    <!-- 斷線 -->
    <section class="screen" data-screen="disconnected" hidden>
      <h2>連線中斷</h2>
      <p class="muted">重新整理就能回到會議室。</p>
      <div class="row">
        <a class="btn" href="/">回首頁</a>
        <button class="btn btn-primary" id="reload-btn">重新整理</button>
      </div>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
